apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-sandbox-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: analytics-sandbox
  policyTypes:
    - Egress
    - Ingress
  egress: []   # No outbound traffic allowed from sandbox pods
  ingress: []  # No inbound traffic either
